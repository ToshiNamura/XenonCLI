name: Bug report
description: Something in the compiler, VM, runtime or CLI does not work as documented
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. Перед созданием проверьте, нет ли уже похожего issue.

  - type: dropdown
    id: component
    attributes:
      label: Компонент
      description: Где проявляется проблема?
      options:
        - compiler (лексер, парсер, кодогенерация, .ixx)
        - vm (инструкции, байт-код, исполнение)
        - runtime (Runtime, куча, стек, xenon.env)
        - asm/disasm (текстовый Xenon ASM, .module)
        - packer (.xenon, манифест)
        - cli
        - build/ci
        - documentation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Версия / коммит
      description: Вывод `xenon version` или SHA коммита
      placeholder: "0.1.0 / 55ee64b"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Минимальный пример, команды и входные файлы
      placeholder: |
        1. xenon compile examples/sqrt_demo.ixx examples/math.hint
        2. xenon run examples/sqrt_demo.module
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Полный вывод, код завершения, при необходимости — `xenon disasm`
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: ОС, компилятор, генератор CMake
      placeholder: "Windows 11, MSVC 19.51, Ninja"
    validations:
      required: false
